name: Labeler

on:
  pull_request_target:

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: review-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
        - uses: greenbone/actions/pr-conventional-commit-labeler@main
          with:
            configuration-toml: release_tag.toml

