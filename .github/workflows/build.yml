name: "Build"

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Which commit to build"
        required: false
        type: string
        default: ${{ github.sha }}
      binary_version:
        description: "Binary version"
        required: false
        type: string
      build_rust_binaries:
        description: "Build the amd64 and arm64 Rust binaries"
        required: false
        type: boolean
        default: true

jobs:
  C:
    name: C
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/greenbone/gvm-libs:stable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - name: install dependencies
        run: |
          sh .github/install-openvas-dependencies.sh
      - name: build 
        run: ./check.sh --verbose ci-build-c
  rs-amd64:
    if: inputs.build_rust_binaries
    uses: ./.github/workflows/rust-binaries.yaml
    with:
      arch: amd64
      runner: ubuntu-latest
      binary_version: ${{ inputs.binary_version }}
      source_ref: ${{ inputs.source_ref }}
  rs-arm64:
    if: inputs.build_rust_binaries
    uses: ./.github/workflows/rust-binaries.yaml
    with:
      arch: arm64
      runner: self-hosted-generic-arm64
      binary_version: ${{ inputs.binary_version }}
      source_ref: ${{ inputs.source_ref }}
