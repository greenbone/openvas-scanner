name: Container

on:
  workflow_call:
    inputs:
      is_latest_tag:
        required: true
        type: string
      is_version_tag:
        required: true
        type: string
      binary_version:
        required: false
        type: string
    secrets:
      dockerhub_user:
        required: true
      dockerhub_token:
        required: true
      cosign_key_opensight:
        required: true
      cosign_password_opensight:
        required: true
      greenbone_bot_token:
        required: true
      greenbone_registry:
        required: true
      greenbone_registry_user:
        required: true
      greenbone_registry_token:
        required: true
      greenbone_registry_read_user:
        required: true
      greenbone_registry_read_token:
        required: true
      greenbone_registry_replication_user:
        required: false
      greenbone_registry_replication_token:
        required: false

# Grants rights to push to the Github container registry.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    if: ${{ github.event_name != 'merge_group' && github.repository == 'greenbone/openvas-scanner' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build:
              name: stable
              dockerfile: .docker/prod.Dockerfile
              stable-name: stable
              edge-name: edge
              variant-build-args: ""
              tags: |
                    type=raw,value=latest,enable=${{ inputs.is_latest_tag }}
                    type=raw,value=stable,enable=${{ inputs.is_latest_tag }}
                    type=semver,pattern={{version}},enable=${{ inputs.is_version_tag }}
                    type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.is_version_tag }}
                    type=semver,pattern={{major}},enable=${{ inputs.is_version_tag }}
                    type=raw,value=edge,enable=${{ github.ref_name == 'main' }}
                    type=raw,value={{branch}}-{{sha}},enable=${{ github.ref_type == 'branch' && github.event_name == 'push' && github.ref_name != 'main' }}
                    type=ref,event=pr
          - build:
              name: testing
              dockerfile: .docker/prod.Dockerfile
              stable-name: testing
              edge-name: testing-edge
              variant-build-args: |
                VERSION=testing-edge
                OPENVAS_SMB_IMAGE=greenbone/openvas-smb:testing-edge
          - build:
              name: oldstable
              dockerfile: .docker/prod.Dockerfile
              stable-name: oldstable
              edge-name: oldstable-edge
              variant-build-args: |
                VERSION=oldstable
                RUST_IMAGE=rust:bookworm
    name: Build and Push Container Images (${{ matrix.build.name }})
    uses: greenbone/workflows/.github/workflows/container-build-push-gea.yml@main
    with:
      name: ${{ matrix.build.name }}
      dockerfile: ${{ matrix.build.dockerfile }}
      stable-name: ${{ matrix.build.stable-name }}
      edge-name: ${{ matrix.build.edge-name }}
      enable-latest: ${{ matrix.build.name == 'stable' }}
      enable-pr: ${{ matrix.build.name == 'stable' }}
      enable-version: ${{ matrix.build.name == 'stable' }}
      labels: |
        org.opencontainers.image.vendor=Greenbone
        org.opencontainers.image.base.name=debian:stable-slim
      tags: ${{ matrix.build.tags }}
      build-args: |
        BIN_VERSION=${{ inputs.binary_version }}
        ${{ matrix.build.variant-build-args }}
      images: |
        ghcr.io/${{ github.repository }},enable=true
        ${{ vars.GREENBONE_REGISTRY }}/community/${{ github.event.repository.name }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule' }}
        ${{ vars.GREENBONE_REGISTRY }}/openvas-detect-dev/${{ github.event.repository.name }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule' }}
    secrets:
      GREENBONE_REGISTRY_USER: ${{ secrets.greenbone_registry_user }}
      GREENBONE_REGISTRY_TOKEN: ${{ secrets.greenbone_registry_token }}

  merge-build:
    if: ${{ github.event_name == 'merge_group' && github.repository == 'greenbone/openvas-scanner' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build:
              name: stable
              variant-build-args: ""
          - build:
              name: testing
              variant-build-args: |
                VERSION=testing-edge
                OPENVAS_SMB_IMAGE=greenbone/openvas-smb:testing-edge
          - build:
              name: oldstable
              variant-build-args: |
                VERSION=oldstable
                RUST_IMAGE=rust:bookworm
    name: Build merge-group container (${{ matrix.build.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fb # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b05f3f5519dd87d3ba754cc423b652a5edd6d2c5 # v4.2.0
      - name: Build merge-group container
        uses: docker/build-push-action@3b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/prod.Dockerfile
          platforms: linux/amd64
          push: ${{ matrix.build.name == 'stable' }}
          tags: ${{ matrix.build.name == 'stable' && format('ghcr.io/{0}:merge-{1}', github.repository, github.sha) || '' }}
          build-args: |
            BIN_VERSION=${{ inputs.binary_version }}
            ${{ matrix.build.variant-build-args }}

  trigger-replication:
    needs:
      - build
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && github.repository == 'greenbone/openvas-scanner' }}
    runs-on: self-hosted-generic
    steps:
      - name: Ensure all tags are replicated on the public registry
        uses: greenbone/actions/trigger-harbor-replication@v3.36.15
        with:
          registry: ${{ vars.GREENBONE_REGISTRY }}
          token: ${{ secrets.GREENBONE_REGISTRY_REPLICATION_TOKEN }}
          user: ${{ secrets.GREENBONE_REGISTRY_REPLICATION_USER }}

  automatix:
    name: Update Automatix
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    uses: greenbone/workflows/.github/workflows/automatix-service.yml@main
    with:
      service: openvas-scanner
      url: ${{ vars.GREENBONE_REGISTRY }}/openvas-detect-dev/${{ github.event.repository.name }}
      tag: ${{ github.ref_name }}
      artifact-pattern: stable
    secrets:
      COSIGN_KEY_OPENSIGHT: ${{ secrets.cosign_key_opensight }}
      COSIGN_KEY_PASSWORD_OPENSIGHT: ${{ secrets.cosign_password_opensight }}
      GREENBONE_BOT_TOKEN: ${{ secrets.greenbone_bot_token }}
      GREENBONE_REGISTRY: ${{ secrets.greenbone_registry }}
      GREENBONE_REGISTRY_USER: ${{ secrets.greenbone_registry_user }}
      GREENBONE_REGISTRY_TOKEN: ${{ secrets.greenbone_registry_token }}
      GREENBONE_REGISTRY_READ_USER: ${{ secrets.greenbone_registry_read_user }}
      GREENBONE_REGISTRY_READ_TOKEN: ${{ secrets.greenbone_registry_read_token }}
