name: Container compatibility

on:
  workflow_call:
    inputs:
      binary_version:
        description: Version embedded in scannerctl and openvasd
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.variant.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant:
              name: stable
              build-args: ""
          - variant:
              name: testing
              build-args: |
                VERSION=testing-edge
                OPENVAS_SMB_IMAGE=greenbone/openvas-smb:testing-edge
          - variant:
              name: oldstable
              build-args: |
                VERSION=oldstable
                RUST_IMAGE=rust:bookworm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/prod.Dockerfile
          platforms: linux/amd64
          build-args: |
            BIN_VERSION=${{ inputs.binary_version }}
            ${{ matrix.variant.build-args }}
