name: Container compatibility

on:
  workflow_call:
    inputs:
      binary_version:
        description: Version embedded in scannerctl and openvasd
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.variant.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant:
              name: stable
              build-args: ""
          - variant:
              name: testing
              build-args: |
                VERSION=testing-edge
                OPENVAS_SMB_IMAGE=greenbone/openvas-smb:testing-edge
          - variant:
              name: oldstable
              build-args: |
                VERSION=oldstable
                RUST_IMAGE=rust:bookworm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b05f3f5519dd87d3ba754cc423b652a5edd6d2c5 # v4.2.0
      - name: Build container
        uses: docker/build-push-action@3b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/prod.Dockerfile
          platforms: linux/amd64
          build-args: |
            BIN_VERSION=${{ inputs.binary_version }}
            ${{ matrix.variant.build-args }}
