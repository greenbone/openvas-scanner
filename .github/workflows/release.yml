name: Release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Semantic version component to increment
        type: choice
        options: [major, minor, patch]
        required: true
        default: patch
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  decide:
    name: Select release kind
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.release-kind.outputs.kind }}
    steps:
      - name: Select release kind
        id: release-kind
        env:
          MANUAL_KIND: ${{ inputs.kind }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HAS_MAJOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'major_release') }}
          HAS_MINOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'minor_release') }}
          HAS_PATCH_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'patch_release') }}
        run: |
          kind=no_release
          if [ -n "$MANUAL_KIND" ]; then
            kind="$MANUAL_KIND"
          elif [ "$PR_MERGED" = true ]; then
            if [ "$HAS_PATCH_LABEL" = true ]; then
              kind="patch"
            elif [ "$HAS_MINOR_LABEL" = true ]; then
              kind="minor"
            elif [ "$HAS_MAJOR_LABEL" = true ]; then
              kind="major"
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  initialize:
    name: Initialize release
    if: needs.decide.outputs.kind != 'no_release'
    needs: decide
    uses: ./.github/workflows/init.yaml
    with:
      release: ${{ needs.decide.outputs.kind }}
      base_ref: ${{ github.base_ref }}

  build:
    name: Build release artifacts
    needs: initialize
    uses: ./.github/workflows/build.yml
    with:
      binary_version: ${{ needs.initialize.outputs.binary_version }}

  create:
    name: Create release
    needs:
      - initialize
      - build
    permissions:
      contents: write
    uses: ./.github/workflows/create-release.yml
    with:
      new_version: ${{ needs.initialize.outputs.release_new_version }}
      latest_version: ${{ needs.initialize.outputs.release_latest_version }}
      release_kind: ${{ needs.initialize.outputs.release_kind }}
      release_ref: ${{ needs.initialize.outputs.release_ref }}
      project: ${{ needs.initialize.outputs.release_project }}
      repository: ${{ github.repository }}
    secrets:
      token: ${{ secrets.GREENBONE_BOT_TOKEN }}
      name: ${{ secrets.GREENBONE_BOT }}
      email: ${{ secrets.GREENBONE_BOT_MAIL }}
      gpg_key: ${{ secrets.GPG_KEY }}
      gpg_pass: ${{ secrets.GPG_PASSPHRASE }}
